<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Rabisco</title>
  <link rel="stylesheet" href="toolbar.css">
</head>
<body>
  <div id="panel">
    <div class="handle" title="Arraste para mover">
      <svg viewBox="0 0 24 8"><circle cx="6" cy="4" r="1.5"/><circle cx="12" cy="4" r="1.5"/><circle cx="18" cy="4" r="1.5"/></svg>
    </div>

    <div class="grid">
      <button data-tool="mouse" title="Mouse — usar os programas (Esc / Ctrl+Shift+D)">
        <svg viewBox="0 0 24 24"><path d="M6 3l12 7.5-5.5 1.5L10 18z"/></svg>
      </button>
      <button data-tool="pen" title="Caneta (P)">
        <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
      </button>
      <button data-tool="highlighter" title="Marca-texto (H)">
        <svg viewBox="0 0 24 24"><path d="M9 14l-2 2v3h3l2-2"/><path d="M9 14l7-10 4 3-7 10z"/><path d="M4 21h8"/></svg>
      </button>
      <button data-tool="eraser" title="Borracha (E)">
        <svg viewBox="0 0 24 24"><path d="M4 15l9-9 6 6-7 7H8z"/><path d="M9 10l6 6"/><path d="M8 19h12"/></svg>
      </button>
      <button data-tool="line" title="Linha (L) — Shift trava em 45°">
        <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>
      </button>
      <button data-tool="arrow" title="Seta (A) — Shift trava em 45°">
        <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><path d="M10 5h9v9"/></svg>
      </button>
      <button data-tool="rect" title="Retângulo (R) — Shift faz quadrado">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
      </button>
      <button data-tool="ellipse" title="Elipse (O) — Shift faz círculo">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>
      </button>
      <button data-tool="text" title="Texto (T) — Enter confirma, Shift+Enter quebra linha">
        <svg viewBox="0 0 24 24"><path d="M5 7V5h14v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
      </button>
      <button data-cmd="board" title="Quadro: transparente → branco → negro (W / B)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M12 17v3"/><path d="M8 20h8"/></svg>
      </button>
    </div>

    <div class="sep"></div>
    <div class="targets">
      <button data-target="fill" title="Preenchimento: cor e transparência (retângulo e elipse)">
        <span class="swatch" id="fill-swatch"></span>
      </button>
      <button data-target="stroke" title="Borda e traço: cor e transparência">
        <span class="swatch ring" id="stroke-swatch"></span>
      </button>
    </div>
    <div class="colors" id="colors"></div>
    <div class="opacities" id="opacities"></div>
    <div class="sizes" id="sizes"></div>
    <div class="sep"></div>

    <div class="grid">
      <button data-cmd="undo" title="Desfazer (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      </button>
      <button data-cmd="redo" title="Refazer (Ctrl+Y)">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
      </button>
      <button data-cmd="copy" title="Copiar print (Ctrl+C) — arraste para escolher a área; depois o modo mouse é ativado para você colar">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg>
      </button>
      <button data-cmd="screenshot" title="Salvar print em arquivo — arraste para escolher a área">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button data-cmd="clear" title="Limpar tudo (Delete / Ctrl+Shift+X)">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
      </button>
      <button data-cmd="minimize" title="Minimizar para perto do relógio (Ctrl+Shift+H) — os desenhos continuam na tela">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button data-cmd="quit" class="danger" title="Fechar o Rabisco">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <script src="shared.js"></script>
  <script src="toolbar.js"></script>
</body>
</html>
